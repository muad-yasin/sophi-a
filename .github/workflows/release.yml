# PLAN_PACKAGING.md §2.4: tag-triggered, builds the Windows NSIS installer and the Linux
# AppImage on GitHub's free-tier hosted runners (2,000 free minutes/month), attaches both to a
# GitHub Release. No macOS/Android/iOS jobs - all explicitly out of scope for v1, see PLAN_PACKAGING.md §3/§3.1.
name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Tauri's Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          # Recent Ubuntu runner images ship without libfuse2, which AppImage's own runtime needs
          # to self-mount - a known gap for AppImage-building CI, not a Sophi-A-specific issue
          # (see docs/linux-packaging-decision.md for how this bit local development too).
          sudo apt-get install -y libfuse2

      - uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch the pinned Node runtime (linux-x64)
        run: ./scripts/fetch-node-runtime.sh linux-x64

      - name: Build the AppImage
        run: npm run tauri build -- --bundles appimage

      - uses: actions/upload-artifact@v4
        with:
          name: sophi-a-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch the pinned Node runtime (win-x64)
        shell: pwsh
        run: |
          $version = "22.23.2"
          $expectedSha256 = "1177b4137ba5adaa56354ae40f1080c7450e8ae09cecb47da459d1c52ac99f97"
          $archive = "node-v$version-win-x64.zip"
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v$version/$archive" -OutFile $archive
          $actualSha256 = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if ($actualSha256 -ne $expectedSha256) {
            Write-Error "SHA-256 mismatch: expected $expectedSha256, got $actualSha256"
            exit 1
          }
          Expand-Archive -Path $archive -DestinationPath .
          New-Item -ItemType Directory -Force -Path dist-node/win-x64
          Copy-Item "node-v$version-win-x64/node.exe" dist-node/win-x64/node.exe
          Copy-Item "node-v$version-win-x64/LICENSE" dist-node/win-x64/LICENSE

      - name: Build the NSIS installer
        run: npm run tauri build -- --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: sophi-a-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe

  publish-release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach both artifacts to the GitHub Release for this tag
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/sophi-a-linux-appimage/*.AppImage
            artifacts/sophi-a-windows-nsis/*.exe
